# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: Evals del agente jerárquico de Parachute S.A. (FAQs + citas)

prompts:
  - "{{pregunta}}"

providers:
  - id: file://provider.py
    label: agente-jerarquico
    config:
      pythonExecutable: ./.venv/bin/python

evaluateOptions:
  # Evita ejecutar varias consultas al agente al mismo tiempo.
  maxConcurrency: 1

defaultTest:
  options:
    # Modelo utilizado como grader para factuality.
    provider: groq:openai/gpt-oss-120b

  assert:
    # Eval de latencia aplicado a todos los casos.
    - type: latency
      threshold: 30000


tests:

  # =====================================================
  # FAQs
  # =====================================================

  - description: FAQ - peso máximo
    vars:
      pregunta: ¿Cuál es el peso máximo permitido para saltar?

    assert:
      # Tool execution
      - type: javascript
        value: file://herramientas.js:llamo
        config:
          nombre: buscar_faq

      # Determinístico - Regex
      - type: regex
        value: "100[\\s\\u00A0\\u202F]*kg"

      # Determinístico - Contains
      - type: contains
        value: "Q250"

      # Factuality
      - type: factuality
        value: >
          El peso máximo permitido para realizar un salto tándem es de
          100 kg. Los participantes entre 90 kg y 100 kg tienen un
          recargo administrativo adicional de Q250.


  - description: FAQ - edad mínima
    vars:
      pregunta: ¿Cuál es la edad mínima para realizar un salto?

    assert:
      - type: javascript
        value: file://herramientas.js:llamo
        config:
          nombre: buscar_faq

      - type: contains
        value: "18 años"

      - type: factuality
        value: >
          La edad mínima para participar es de 18 años cumplidos.
          Las personas de 16 y 17 años pueden participar únicamente
          acompañadas de ambos padres o tutores legales, quienes deben
          firmar la autorización correspondiente.


  - description: FAQ - buceo
    vars:
      pregunta: ¿Cuánto tiempo debo esperar después de bucear para poder saltar?

    assert:
      - type: javascript
        value: file://herramientas.js:llamo
        config:
          nombre: buscar_faq

      - type: contains
        value: "24 horas"

      - type: factuality
        value: >
          Debe existir un intervalo mínimo de 24 horas entre la última
          inmersión de buceo y la hora del salto, para reducir el riesgo
          de enfermedad por descompresión.


  - description: FAQ - altura del salto
    vars:
      pregunta: ¿A qué altura se realiza el salto tándem?

    assert:
      - type: javascript
        value: file://herramientas.js:llamo
        config:
          nombre: buscar_faq

      - type: regex
        value: "3[\\s\\u00A0\\u202F,.]*000[\\s\\u00A0\\u202F]*(m|metros)"

      - type: factuality
        value: >
          El salto tándem se realiza a una altitud de 3,000 metros,
          aproximadamente 10,000 pies sobre el nivel medio del mar.
          El paracaídas principal se despliega a una altura de
          1,500 metros sobre el terreno.


  - description: FAQ - apertura del paracaídas
    vars:
      pregunta: ¿A qué altura se abre el paracaídas?

    assert:
      - type: javascript
        value: file://herramientas.js:llamo
        config:
          nombre: buscar_faq

      - type: regex
        value: "1[\\s\\u00A0\\u202F,.]*500[\\s\\u00A0\\u202F]*(m|metros)"

      - type: factuality
        value: >
          El paracaídas principal es desplegado por el instructor
          a una altura de 1,500 metros sobre el terreno.
          El salto se realiza desde aproximadamente 3,000 metros.


  - description: FAQ - cámaras personales
    vars:
      pregunta: ¿Puedo saltar con mi propia cámara GoPro o mi celular?

    assert:
      - type: javascript
        value: file://herramientas.js:llamo
        config:
          nombre: buscar_faq

      - type: regex
        value: "[Nn]o (se )?(permite|está permitido|puede)"

      - type: factuality
        value: >
          No se permite utilizar cámaras, teléfonos celulares ni GoPro
          personales durante el vuelo o la caída libre por razones de
          seguridad. La empresa ofrece servicios profesionales de
          fotografía y video.


  - description: FAQ - parqueo sin respuesta concreta
    vars:
      pregunta: ¿Hay parqueo disponible en el lugar del evento?

    assert:
      - type: javascript
        value: file://herramientas.js:llamo
        config:
          nombre: buscar_faq

      - type: factuality
        value: >
          La base de conocimientos no proporciona una respuesta concreta
          que confirme o niegue la disponibilidad de parqueo. Para obtener
          información específica se debe consultar a la central de atención
          al cliente de Parachute S.A.


  - description: FAQ - velocidad de caída libre
    vars:
      pregunta: ¿Cuál es la velocidad que se alcanza en caída libre?

    assert:
      # Debe consultar FAQs.
      - type: javascript
        value: file://herramientas.js:llamo
        config:
          nombre: buscar_faq

      # No debería intentar agendar.
      - type: javascript
        value: file://herramientas.js:noLlamo
        config:
          nombre: calendarizar_cita

      # No debería consultar clima.
      - type: javascript
        value: file://herramientas.js:noLlamo
        config:
          nombre: consultar_clima

      - type: regex
        value: "200[\\s\\u00A0\\u202F]*km/h"

      - type: regex
        value: "35[\\s\\u00A0\\u202F]*(a|[-–-])[\\s\\u00A0\\u202F]*45[\\s\\u00A0\\u202F]*segundos"

      - type: factuality
        value: >
          Durante la caída libre se alcanza una velocidad terminal
          promedio de 200 km/h, mantenida aproximadamente durante
          35 a 45 segundos antes de la apertura del paracaídas principal.


  # =====================================================
  # Citas
  # =====================================================

  - path: file://tests_citas.py:generate_tests