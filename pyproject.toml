[project]
name = "laboratorio4-agentes"
version = "0.1.0"
description = "Agente de atención al cliente Parachute S.A. con base de conocimientos FAQ (pgvector + Groq)"
requires-python = ">=3.13"
dependencies = [
    "groq>=1.7.0",
    "openai-agents>=0.22.3",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.8",
]
